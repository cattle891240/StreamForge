name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    # 与 ci.yml 保持一致，锁定 macos-15（ADR-001：避免 SDK 版本漂移）
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 赋予脚本执行权限
        run: chmod +x Scripts/*.sh

      - name: 读取版本号
        id: version
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          test -n "$VER" || (echo "VERSION 文件为空" && exit 1)
          echo "tag=${GITHUB_REF_NAME}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "版本号：$VER（标签：${GITHUB_REF_NAME}）"

      - name: 架构门禁与测试
        run: |
          ./Scripts/check-layout.sh
          ./Scripts/test.sh

      - name: 导入签名证书（可选）
        # 必须在「构建并打包」之前：build.sh/package.sh 签名时需要钥匙串里的证书
        # 未配置 secrets 时整体跳过，产物回退为 ad-hoc 签名（向后兼容）
        # 注意：secrets 上下文禁止在 if: 中使用，故改为在 shell 内判断
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "未配置 MACOS_CERTIFICATE，跳过证书导入（产物回退为 ad-hoc 签名）"
            exit 0
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" /tmp/build.keychain
          security import /tmp/cert.p12 -k /tmp/build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$MACOS_KEYCHAIN_PASSWORD" /tmp/build.keychain
          rm -f /tmp/cert.p12

      - name: 构建并打包（含签名）
        # 未配置 MACOS_SIGNING_IDENTITY 时，build.sh 自动回退为 ad-hoc 签名（向后兼容）
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          ./Scripts/build.sh
          ./Scripts/package.sh

      - name: 公证（可选）
        # 未配置公证凭据时跳过；secrets 上下文禁止在 if: 中使用，故在 shell 内判断
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          if [ -z "$NOTARIZATION_APPLE_ID" ]; then
            echo "未配置公证凭据，跳过公证"
            exit 0
          fi
          DMG="$(ls dist/*.dmg | head -1)"
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: 生成校验和
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 判定是否为预发布
        id: pre
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 创建 Release 草稿
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.pre.outputs.prerelease }}
          name: StreamForge ${{ github.ref_name }}
          body: |
            详见 [CHANGELOG.md](CHANGELOG.md) 获取完整变更记录。

            安装说明见 README 的「运行与安装」一节。
            已签名并公证的构建可直接双击打开；若本次构建未配置签名，
            首次启动需右键点击应用选择「打开」。
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
